[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callbs"
version = "0.1.0"
description = "Vendor-neutral A/B harness: does your coding-agent cost optimizer save money on your repo?"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
callbs = "callbs.cli:main"

[tool.setuptools.packages.find]
include = ["callbs*"]

[tool.setuptools.package-data]
callbs = ["data/*.json"]
